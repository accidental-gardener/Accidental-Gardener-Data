name: Build the app and publish v1.0

on:
  push:
    branches: [main]
    paths: ["app-source/**", "plants.json", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key has been added
        env:
          KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the SIGNING_KEY_BASE64 and SIGNING_PASSWORD secrets first (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the latest plant database inside the app
        run: cp plants.json app-source/app/src/main/assets/plants.json

      - name: Build the APK
        working-directory: app-source
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/gardener.jks"
          export SIGNING_KEY_FILE="$RUNNER_TEMP/gardener.jks"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../AccidentalGardener.apk
          rm -f "$RUNNER_TEMP/gardener.jks"

      - name: Put it on the v1.0 download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --title "v1.0 (test version)" --notes "Test version of The Accidental Gardener."
          gh release upload v1.0 AccidentalGardener.apk --clobber
